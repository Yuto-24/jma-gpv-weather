name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]" build
      - run: pytest -q
      - run: python -m build
      - run: python -m pip uninstall -y jma-gpv-weather
      - run: python -m pip install --no-deps dist/*.whl
      - run: pytest -q
      - run: jma-gpv-weather --help
      - run: jma-gpv-msm-csv --help
