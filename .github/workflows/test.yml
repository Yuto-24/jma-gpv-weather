name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]" build
      - run: pytest -q
      - run: python -m build
      - run: python -m pip uninstall -y jma-gpv-weather
      - run: python -m pip install --no-deps dist/*.whl
      - run: pytest -q
      - run: jma-gpv-weather --help
      - run: jma-gpv-msm-csv --help
  pyodide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/pyodide/package-lock.json
      - run: python -m pip install -e ".[test]" build
      - run: python -m build
      - run: python tests/runtime_case.py .runtime-case
      - run: npm ci --prefix tests/pyodide
      - run: npm exec --prefix tests/pyodide -- playwright install --with-deps chromium
      - run: npm test --prefix tests/pyodide
