[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jma-msm-wind"
version = "0.2.1"
description = "Download, cache, and query JMA MSM weather forecasts from the RISH archive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pygrib>=2.1.6",
  "xarray>=2024.1",
  "h5netcdf>=1.3",
  "h5py>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
msm-wind = "msm_wind.cli:main"
msm-weather = "msm_wind.weather_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_data: opt-in tests requiring official terrain assets or network data",
]
