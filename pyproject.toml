[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jma-gpv-weather"
version = "0.6.0"
description = "Download, cache, and query JMA GPV weather forecasts (MSM and GSM Japan) from the RISH archive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "tzdata>=2024.1; sys_platform == 'emscripten'",
  "pygrib>=2.1.6; sys_platform != 'emscripten'",
  "xarray>=2024.1; sys_platform != 'emscripten'",
  "h5netcdf>=1.3; sys_platform != 'emscripten'",
  "h5py>=3.10; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jma-gpv-msm-csv = "jma_gpv_weather.msm.csv_cli:main"
jma-gpv-weather = "jma_gpv_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jma_gpv_weather*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: opt-in RISH MSM/GSM integration (network and GRIB download)"]
