[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jma-msm-wind"
version = "0.1.0"
description = "Download and extract JMA MSM wind forecasts from the RISH archive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pygrib>=2.1.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
msm-wind = "msm_wind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
